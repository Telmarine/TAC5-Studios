plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.165'
}

version = mod_version
group = 'com.tenko.titlescrolls'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Optional soft dependency, used only by integration/NeoEssentialsIntegration.java
    // to register the {tenko_title} chat placeholder. This mod runs completely
    // standalone without it.
    //
    // To build WITH the NeoEssentials bridge: drop the exact NeoEssentials jar you
    // have installed (e.g. neoessentials-1.0.5-1.21.x+build.54-all.jar) into libs/.
    // To build WITHOUT it (e.g. you don't run NeoEssentials on your server): just
    // delete src/main/java/com/tenko/titlescrolls/integration/NeoEssentialsIntegration.java
    // and the one guarded call to it in TitleScrolls.java's commonSetup() — nothing
    // else in this mod references NeoEssentials at all.
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}