modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# NeoEssentials is an OPTIONAL soft dependency, used only for the chat-tag
# placeholder bridge (see integration/NeoEssentialsIntegration.java). This mod
# runs fully standalone — title unlocks, the /title GUI, and everything else
# work with zero dependencies installed.
[[dependencies.${mod_id}]]
    modId = "neoessentials"
    type = "optional"
    versionRange = "[1.0.0,)"
    ordering = "AFTER"
    side = "SERVER"
